name: phase1-report-upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch report UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/vibeguard/src/App.tsx')
          s=p.read_text()
          if "@/components/ReportEnhancements" not in s:
            s=s.replace("import { RepoPicker } from '@/components/RepoPicker';", "import { RepoPicker } from '@/components/RepoPicker';\nimport { ReportEnhancements } from '@/components/ReportEnhancements';")
          marker='          <SummaryBar report={report} />'
          if '<ReportEnhancements report={report} />' not in s:
            if marker not in s: raise SystemExit('SummaryBar marker not found')
            s=s.replace(marker, marker+'\n          <ReportEnhancements report={report} />', 1)
          s=s.replace('scope: public source files · six high-signal checks','scope: public source files · 50 security checks')
          s=s.replace("label: 'Six signal checks'","label: '50 security checks'")
          s=s.replace('Six checks. The ones that actually matter.','50 checks. The signals that actually matter.')
          s=s.replace('These patterns are responsible for the overwhelming majority of Next.js and Supabase security incidents — and vibecoding assistants introduce them constantly.','Fifty focused signals across database access, secrets, injection, dependencies, containers, browser APIs, and infrastructure patterns commonly introduced by AI-assisted development.')
          p.write_text(s)
          PY
          rm .github/workflows/phase1-ui.yml .phase1-trigger || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/vibeguard/src/App.tsx artifacts/vibeguard/src/components/ReportEnhancements.tsx .github/workflows/phase1-ui.yml .phase1-trigger
          git commit -m 'feat: add security score and actionable remediation'
          git push
