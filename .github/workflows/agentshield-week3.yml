name: AgentShield Week 3 Hardening
on:
  push:
    branches:
      - feat/agentshield-week3-production-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  week3:
    name: Final gate, repair loop, security regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Locked dependency install
        run: pnpm install --frozen-lockfile
      - name: Existing API typecheck (baseline errors; informational only)
        continue-on-error: true
        run: pnpm run typecheck:libs && pnpm --filter @workspace/api-server run typecheck
      - name: Existing SUE regression suite
        run: pnpm --filter @workspace/api-server run test:sue
      - name: Build local scanner
        run: pnpm --filter @workspace/api-server run build:agentshield
      - name: Week 1 tests
        run: pnpm --filter @workspace/api-server run test:agentshield
      - name: Week 2 tests
        run: pnpm --filter @workspace/api-server run test:agentshield:week2
      - name: Week 3 hardening and simulated agent tests
        run: pnpm --filter @workspace/api-server run test:agentshield:week3
