name: VibeSane CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibesane-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, typecheck and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs

      - name: Build frontend
        run: pnpm --filter @workspace/vibeguard run build

      - name: Typecheck frontend
        run: pnpm --filter @workspace/vibeguard run typecheck

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build

      - name: Typecheck backend
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Run SUE regression tests
        run: pnpm --filter @workspace/api-server run test:sue
