name: AgentShield Week 1 Tests
on:
  push:
    branches:
      - feat/agentshield-week1-claude-hooks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentshield:
    name: Build and test local CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Build AgentShield only
        run: pnpm --filter @workspace/api-server run build:agentshield
      - name: Run isolated security fixture and hook tests
        run: pnpm --filter @workspace/api-server run test:agentshield
