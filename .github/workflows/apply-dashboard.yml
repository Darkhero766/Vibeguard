name: apply-dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire dashboard into home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/vibeguard/src/App.tsx')
          s = p.read_text()
          if "@/components/SecurityDashboard" not in s:
              s = s.replace("import { ReportEnhancements } from '@/components/ReportEnhancements';", "import { ReportEnhancements } from '@/components/ReportEnhancements';\nimport { SecurityDashboard } from '@/components/SecurityDashboard';")
          start = s.index('                {/* ── LOGGED-IN: personalized hero ── */}')
          end = s.index('                {apiError && (', start)
          replacement = '''                {/* ── LOGGED-IN: security command center ── */}\n                {user && (\n                  <SecurityDashboard\n                    firstName={firstName}\n                    lastScan={lastScan}\n                    usage={usage}\n                    isAtLimit={isAtLimit}\n                    onViewLastScan={handleViewLastScan}\n                    onProtect={() => {\n                      document.getElementById('repo-url')?.focus();\n                    }}\n                  />\n                )}\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-dashboard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/vibeguard/src/App.tsx artifacts/vibeguard/src/components/SecurityDashboard.tsx .github/workflows/apply-dashboard.yml
          git commit -m 'feat: add clean security command center dashboard'
          git push
