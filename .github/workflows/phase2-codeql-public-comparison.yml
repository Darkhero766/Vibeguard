name: Phase 2 — One-shot independent CodeQL comparison on public-source subsets

on:
  push:
    branches:
      - feat/agentshield-phase1-phase2-security

permissions:
  contents: read

jobs:
  compare-pinned-public-source:
    name: CodeQL on read-only pinned public JS/TS subsets (no code execution)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-public-codeql]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch exact-SHA OSI licensed public source; do not clone, build or execute
        run: |
          node artifacts/api-server/scripts/prepare-public-codeql-snapshot.mjs \
            artifacts/api-server/benchmarks/real-world/phase2-app-holdout-22.v1.json \
            phase2-public-codeql-sources
      - name: Initialize CodeQL JS/TS semantic engine (no build; only public source root)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          source-root: phase2-public-codeql-sources
          queries: +security-extended
      - name: Analyze the public subset; never upload findings into repository Code Scanning
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: phase2-codeql-sarif
      - name: Publish source-free comparison metadata and CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-public-only-codeql-comparator
          path: |
            phase2-public-codeql-metadata.json
            phase2-codeql-sarif/*.sarif
          if-no-files-found: warn
          retention-days: 3
