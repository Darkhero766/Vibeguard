name: Foxy qualification

on:
  pull_request:
    branches:
      - feat/agentshield-beta-coding-agent-install
    paths:
      - "artifacts/api-server/scripts/**"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/skills/**"
      - "artifacts/vibeguard/src/**"
      - "artifacts/vibeguard/scripts/**"
      - "artifacts/vibeguard/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/agentshield-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foxy-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Foxy release qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CI: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
      VITE_DEPLOYMENT_ENV: staging
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact Foxy source revision
        env:
          FOXY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node artifacts/api-server/scripts/verify-foxy-source.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install workspace dependencies and provision platform binaries
        run: pnpm install --no-frozen-lockfile

      - name: Commit synchronized workspace lockfile for deterministic deploys
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pnpm-lock.yaml';
            const branch = context.payload.pull_request.head.ref;
            const remote = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });
            if (Array.isArray(remote.data) || remote.data.type !== 'file') {
              throw new Error('Expected a single pnpm-lock.yaml file on the Foxy PR branch.');
            }
            const localContent = fs.readFileSync(path, 'utf8');
            const remoteContent = Buffer.from(remote.data.content, 'base64').toString('utf8');
            if (localContent === remoteContent) {
              core.info('Committed lockfile already matches the workspace manifests and overrides.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch,
                sha: remote.data.sha,
                message: 'chore(deps): synchronize pnpm workspace lockfile',
                content: Buffer.from(localContent, 'utf8').toString('base64')
              });
              core.notice('Synchronized pnpm-lock.yaml for reproducible frozen installs.');
            }


      - name: Build VibeSane app and standalone Foxy staging page
        run: pnpm --filter @workspace/vibeguard run build && pnpm --filter @workspace/vibeguard run test:foxy:page && node artifacts/vibeguard/scripts/staging-postbuild.mjs && node artifacts/vibeguard/scripts/build-foxy-preview.mjs && pnpm --filter @workspace/vibeguard run test:foxy:preview

      - name: Run cross-platform connector regression tests
        run: pnpm --filter @workspace/api-server run test:agentshield:connect

      - name: Run complete AgentShield release qualification
        run: pnpm --filter @workspace/api-server run test:agentshield:release-qualification

      - name: Upload source-matched qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foxy-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/api-server/dist/agentshield-release-validation.json
            artifacts/vibeguard/dist/public/index.html
            artifacts/vibeguard/dist/public/foxy/index.html
            pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 14
