name: AgentShield cross-platform qualification

on:
  pull_request:
    branches:
      - feat/agentshield-beta-coding-agent-install
    paths:
      - "artifacts/api-server/scripts/**"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/skills/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/agentshield-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentshield-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: AgentShield release qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CI: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install workspace dependencies and provision platform binaries
        run: pnpm install --no-frozen-lockfile

      - name: Build VibeSane web app and static metadata
        run: pnpm --filter @workspace/vibeguard run build

      - name: Run cross-platform connector regression tests
        run: pnpm --filter @workspace/api-server run test:agentshield:connect

      - name: Run complete AgentShield release qualification
        run: pnpm --filter @workspace/api-server run test:agentshield:release-qualification

      - name: Upload source-matched qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/api-server/dist/agentshield-release-validation.json
            pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 14
