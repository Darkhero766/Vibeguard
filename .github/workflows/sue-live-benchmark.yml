name: SUE Live Benchmark

on:
  push:
    branches: ["sue/live-real-world-benchmark"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  live-sue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec esbuild src/lib/plan.ts --bundle --platform=node --format=esm --external:@workspace/db --outfile=/tmp/vibeguard-plan-check.mjs
      - run: pnpm --filter @workspace/api-server exec esbuild src/routes/audit.ts --bundle --platform=node --format=esm --external:@workspace/db --outfile=/tmp/vibeguard-audit-route-check.mjs
      - run: pnpm --filter @workspace/api-server exec esbuild src/app.ts --bundle --platform=node --format=esm --external:@workspace/db --outfile=/tmp/vibeguard-app-check.mjs
      - run: pnpm --filter @workspace/api-server run test:sue
      - run: pnpm --filter @workspace/api-server run benchmark:sue
      - name: Run real-world vibecoded policy benchmark
        run: pnpm --filter @workspace/api-server run benchmark:sue:policies
        env:
          SUE_POLICY_REPORT_PATH: sue-policy-benchmark-report.json
      - run: pnpm --filter @workspace/api-server run benchmark:sue:live
      - name: Upload SUE policy benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sue-vibecoded-policy-benchmark
          path: artifacts/api-server/sue-policy-benchmark-report.json
          if-no-files-found: warn
