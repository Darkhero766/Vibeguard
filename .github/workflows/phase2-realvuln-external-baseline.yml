name: Phase 2 — Frozen external RealVuln JS/TS source-only baseline

on:
  push:
    branches:
      - feat/agentshield-phase1-phase2-security

permissions:
  contents: read

jobs:
  frozen-realvuln:
    name: Compare 8 pinned third-party manual labels (no remote app execution)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-realvuln-baseline]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VIBESANE_RULESET_SHA: ${{ github.sha }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install exact locked scanner dependencies only
        run: pnpm install --frozen-lockfile
      - name: Verify benchmark scoring fails closed on altered ground truth
        run: node --test artifacts/api-server/scripts/test-vibesane-realvuln8.mjs
      - name: Read only exact pinned MIT public source and Apache-licensed external labels
        run: |
          node artifacts/api-server/scripts/benchmark-vibesane-realvuln8.mjs \
            artifacts/api-server/benchmarks/real-world/phase2-external-realvuln-nextjs-8.v1.json \
            /tmp/vibesane-realvuln8-results.json
      - name: Upload metadata only, never vulnerable source or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-external-realvuln8-baseline
          path: /tmp/vibesane-realvuln8-results.json
          if-no-files-found: warn
          retention-days: 7
